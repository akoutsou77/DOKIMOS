plugins { id 'com.android.application' }

android {
    namespace 'com.openai.synccam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.synccam'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '7.6.3-storage-diagnostics-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "androidx.documentfile:documentfile:1.1.0"
}
