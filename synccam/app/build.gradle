plugins { id 'com.android.application' }

android {
    namespace 'com.openai.synccam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.synccam'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '6.0.0-auto-camera'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
