name: Validate SyncCam v7.6.7 storage contract

on:
  push:
    branches:
      - agent/synccam-storage-v767
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply storage-contract patch
        run: python .github/scripts/synccam_v767_storage_contract.py
      - name: Verify storage-layout invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('synccam/app/src/main/java/com/openai/synccam/MainActivity.java').read_text()
          photo = Path('synccam/app/src/main/java/com/openai/synccam/PhotoTransfer.java').read_text()
          writer = Path('synccam/app/src/main/java/com/openai/synccam/MediaStoreJpegWriter.java').read_text()
          layout = Path('synccam/app/src/main/java/com/openai/synccam/StorageLayout.java').read_text()
          gradle = Path('synccam/app/build.gradle').read_text()
          required = {
              'root constant': 'static final String ROOT_FOLDER = "SyncCam";' in layout,
              'host folder contract': '"HOST_" : "PHONE_"' in layout,
              'pictures root contract': 'Environment.DIRECTORY_PICTURES + "/" + ROOT_FOLDER' in layout,
              'host propagates project': 'net.sendCapture(seq, target, projectSnapshot);' in main,
              'capture packet carries project': 'target + "|" + captureProject' in main,
              'client reads project': 'p.length >= 5 ? StorageLayout.project(p[4])' in main,
              'client uses PHONE layout': 'StorageLayout.relativeDevicePath(storageProject, hostCapture, deviceId)' in main,
              'incoming original preserved': 'String originalName = in.readUTF()' in photo and 'StorageLayout.incomingFileName(originalName' in photo,
              'incoming PHONE folder': 'StorageLayout.relativeDevicePath(safeProject, false, safeId)' in photo,
              'SAF root aware': 'boolean rootIsSyncCam' in writer,
              'version': "versionCode 20" in gradle and "7.6.7-storage-contract" in gradle,
          }
          failed = [k for k,v in required.items() if not v]
          if failed:
              raise SystemExit('FAILED invariants: ' + ', '.join(failed))
          print('All storage-layout invariants passed')
          PY
      - name: Build APK
        working-directory: synccam
        run: gradle assembleDebug --stacktrace
      - name: Commit validated generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synccam/app/build.gradle \
                  synccam/app/src/main/java/com/openai/synccam/MainActivity.java \
                  synccam/app/src/main/java/com/openai/synccam/PhotoTransfer.java \
                  synccam/app/src/main/java/com/openai/synccam/MediaStoreJpegWriter.java \
                  synccam/app/src/main/java/com/openai/synccam/StorageLayout.java
          if ! git diff --cached --quiet; then
            git commit -m "SyncCam v7.6.7 storage contract"
            git push origin HEAD:agent/synccam-storage-v767
          fi
      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.6.7-storage-contract-test
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
