name: Build SyncCam storage diagnostics test

on:
  push:
    branches:
      - agent/synccam-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add storage diagnostics UI
        run: python3 tools/patch_storage_diag.py
      - name: Verify diagnostic source
        run: |
          grep -q "versionCode 16" app/build.gradle
          grep -q "7.6.3-storage-diagnostics-test" app/build.gradle
          grep -q "STORAGE TESTS  •  T01-T11" app/src/main/java/com/openai/synccam/MainActivity.java
          grep -q '"T01"' app/src/main/java/com/openai/synccam/StorageDiagnostics.java
          grep -q '"T11"' app/src/main/java/com/openai/synccam/StorageDiagnostics.java
      - name: Build diagnostic APK
        run: gradle assembleDebug --stacktrace
      - name: Commit generated diagnostic UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/openai/synccam/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "SyncCam storage diagnostics T01-T11 UI"
            git push origin HEAD:agent/synccam-apk-build
          fi
      - name: Upload diagnostic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.6.3-storage-diagnostics-test
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish diagnostics GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.6.3-STORAGE-DIAGNOSTICS.apk
          if gh release view v7.6.3-storage-diagnostics --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.6.3-storage-diagnostics /tmp/SyncCam-v7.6.3-STORAGE-DIAGNOSTICS.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.6.3-storage-diagnostics /tmp/SyncCam-v7.6.3-STORAGE-DIAGNOSTICS.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.6.3 STORAGE DIAGNOSTICS" \
              --prerelease \
              --notes "Diagnostic build for Android 11 storage failures. Captures one real JPEG and runs numbered storage tests T01-T11 across internal storage, app-specific external storage, multiple MediaStore routes, Storage Access Framework selected-folder routes, the current SyncCam writer, and raw public Pictures access. Use COPY REPORT and return the complete T01-T11 result. This diagnostic release does not replace the stable v7.6.2 main release."
          fi
