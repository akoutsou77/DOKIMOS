name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.6.5-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v7.6.5 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "versionName '7.6.5-api30-direct-t10-capture'" app/build.gradle; then
            echo "Source is not v7.6.5; release publication skipped."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.6.5.apk
          if gh release view v7.6.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.6.5 /tmp/SyncCam-v7.6.5.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.6.5 /tmp/SyncCam-v7.6.5.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.6.5" \
              --notes "Android 11/API 30 capture-path correction derived from physical T10 diagnostics. The normal shutter now enters a dedicated saveJpegApi30T10 transaction: MediaStore writer -> publish -> committed URI. Optional EXIF and photo-manifest bookkeeping are outside the commit transaction, and once the JPEG is committed no later exception is allowed to abort/delete it. The UI reports API30 T10 PATH after a successful Android 11 shutter save. Project/session HOST_<id> and PHONE_<id> organization is preserved."
          fi
