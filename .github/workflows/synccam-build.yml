name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v5.0.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v5.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v5.0.0.apk
          if gh release view v5.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v5.0.0 /tmp/SyncCam-v5.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v5.0.0 /tmp/SyncCam-v5.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v5.0.0" \
              --notes "Per-device host photo sync. The host lists each connected client with an individual SYNC control, plus SYNC ALL. Client uploads are incremental within the app session so already transferred JPEGs are not resent. Photos are stored in Pictures/SyncCam on the host."
          fi
