name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.4.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v7.4.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "versionName '7.4.0-foreground'" app/build.gradle; then
            echo "Source is not v7.4.0; release publication skipped."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.4.0.apk
          if gh release view v7.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.4.0 /tmp/SyncCam-v7.4.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.4.0 /tmp/SyncCam-v7.4.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.4.0" \
              --notes "Keeps SyncCam visually on top while active using immersive sticky full-screen mode, hides system status/navigation bars, keeps the screen awake, reapplies immersive mode on focus/resume, and shows the camera activity over the lock screen where Android permits. Existing camera, lens, native-aspect viewport, sync, auto-capture, photo transfer and GPS EXIF features are preserved."
          fi
