name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v6 auto capture and camera settings
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        working-directory: .
        run: |
          if grep -q "versionName '6.0.0-auto-camera'" synccam/app/build.gradle; then
            echo "v6 source already applied"
          else
            python tools/apply_v6_auto_camera.py
          fi
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Commit validated v6 source to CI branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synccam/app/src/main/java/com/openai/synccam/MainActivity.java synccam/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "SyncCam v6 automatic capture and camera settings"
            git push origin HEAD:agent/synccam-apk-build
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v6.0.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
