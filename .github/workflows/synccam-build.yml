name: Build SyncCam APK

on:
  push:
    branches:
      - agent/synccam-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-debug-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v3.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v3.0.0.apk
          if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.0.0 /tmp/SyncCam-v3.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v3.0.0 /tmp/SyncCam-v3.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "SyncCam v3.0.0" \
              --notes "Working SyncCam Android release. Supports two or more phones on the same local Wi-Fi or Android phone hotspot, direct host/client discovery, clock synchronisation, synchronized future-trigger capture, and the polished camera control interface."
          fi
