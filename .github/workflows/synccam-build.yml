name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Polish v7 lens UI and GPS permission flow
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('synccam/app/src/main/java/com/openai/synccam/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('lensButton.setText("LENS\\\\n" + shown)', 'lensButton.setText("LENS\\n" + shown)')
          old = '''        if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED)\n            p.add(Manifest.permission.ACCESS_COARSE_LOCATION);\n        if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED)\n            p.add(Manifest.permission.ACCESS_FINE_LOCATION);'''
          new = '''        if (Build.VERSION.SDK_INT <= 32) {\n            if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED)\n                p.add(Manifest.permission.ACCESS_COARSE_LOCATION);\n            if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED)\n                p.add(Manifest.permission.ACCESS_FINE_LOCATION);\n        }'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Commit v7 polish to CI branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/v7-polish-trigger.txt
          git add -u .github/v7-polish-trigger.txt || true
          git add synccam/app/src/main/java/com/openai/synccam/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "Polish SyncCam v7 lens and GPS UI"
            git push origin HEAD:agent/synccam-apk-build
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.0.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
