name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v7 Camera2 integration
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        working-directory: .
        run: python tools/apply_v7_camera2.py
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Commit validated v7 source to CI branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_v7_camera2.py .github/v7-camera2-trigger.txt
          git add synccam/app/src/main/java/com/openai/synccam/MainActivity.java
          git add synccam/app/src/main/java/com/openai/synccam/Camera2Controller.java
          git add synccam/app/src/main/java/com/openai/synccam/LocationExifHelper.java
          git add synccam/app/src/main/AndroidManifest.xml synccam/app/build.gradle synccam/gradle.properties
          git commit -m "SyncCam v7 Camera2 lenses and GPS EXIF"
          git push origin HEAD:agent/synccam-apk-build
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.0.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
