name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.6.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v7.6.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "versionName '7.6.0-session-integrity'" app/build.gradle; then
            echo "Source is not v7.6.0; release publication skipped."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.6.0.apk
          if gh release view v7.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.6.0 /tmp/SyncCam-v7.6.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.6.0 /tmp/SyncCam-v7.6.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.6.0" \
              --notes "Audited project/session storage integrity. Host captures stay in Pictures/SyncCam/<Project>/HOST_<id>; client copies stay in PHONE_<id>. Project changes create a capture boundary, sync requests are bound to the project snapshot that started them, stale earlier captures are rejected, client captures are tagged by group, unsynced client photo manifests survive app restarts, persistent device IDs are retained, and Android 8/9 receive explicit project folder fallback storage."
          fi
