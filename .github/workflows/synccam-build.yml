name: Build SyncCam APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v4.0.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v4.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v4.0.0.apk
          if gh release view v4.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v4.0.0 /tmp/SyncCam-v4.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v4.0.0 /tmp/SyncCam-v4.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v4.0.0" \
              --notes "Adds host-side photo collection. After synchronized capture, the HOST can press SYNC PHOTOS to request all client JPEGs. Photos are transferred directly over the local Wi-Fi/hotspot using a TCP photo channel and stored in Pictures/SyncCam on the host phone. Existing capture synchronization and direct hotspot networking are preserved."
          fi
