name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.6.4-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v7.6.4 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "versionName '7.6.4-api30-proven-storage'" app/build.gradle; then
            echo "Source is not v7.6.4; release publication skipped."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.6.4.apk
          if gh release view v7.6.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.6.4 /tmp/SyncCam-v7.6.4.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.6.4 /tmp/SyncCam-v7.6.4.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.6.4" \
              --notes "Android 11/API 30 fix derived from physical storage diagnostics: T03, T04, T05, T06, T07 and the complete T10 SyncCam writer all succeeded, with T10 landing in the correct project/HOST folder. API 30 now prefers the proven MediaStore route even when a SAVE ROOT is configured, and the freshly saved JPEG is published without reopening it through ExifInterface rw. Optional EXIF enrichment cannot invalidate a valid API 30 capture. Android 12+ retains the existing metadata path. Project/session and per-device folder organization are preserved."
          fi
