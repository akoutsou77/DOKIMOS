name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.0.0-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v7.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.0.0.apk
          if gh release view v7.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.0.0 /tmp/SyncCam-v7.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.0.0 /tmp/SyncCam-v7.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.0.0" \
              --notes "Camera2 capture engine with logical and physical lens selection where exposed by Android, per-lens camera settings, optional GPS EXIF, lens/focal metadata, automatic synchronized interval capture, and per-device photo sync. Existing direct hotspot/local Wi-Fi synchronization is preserved."
          fi
      - name: Publish v7 from validated main source via CI branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/synccam-apk-build'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.0.0.apk
          gh release delete v7.0.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v7.0.0 /tmp/SyncCam-v7.0.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MAIN_SHA" \
            --title "SyncCam v7.0.0" \
            --notes "Camera2 capture engine with logical and physical lens selection where exposed by Android, per-lens camera settings, optional GPS EXIF, lens/focal metadata, automatic synchronized interval capture, and per-device photo sync. Existing direct hotspot/local Wi-Fi synchronization is preserved."
