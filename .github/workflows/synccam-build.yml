name: Build SyncCam APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synccam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncCam-v7.6.1-apk
          path: synccam/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish SyncCam v7.6.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "versionName '7.6.1-android11-storage'" app/build.gradle; then
            echo "Source is not v7.6.1; release publication skipped."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.6.1.apk
          if gh release view v7.6.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.6.1 /tmp/SyncCam-v7.6.1.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.6.1 /tmp/SyncCam-v7.6.1.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SyncCam v7.6.1" \
              --notes "Android 11 storage hardening. Uses MediaStore pending-write-publication transactions on Android 10+, explicitly targets the primary external media collection, validates JPEG bytes and stored size, surfaces exact save failures instead of false success, and applies the same safe storage path to host-received client photos. No Developer Options or broad storage permission are required on Android 11."
          fi
