name: Apply SyncCam v5 Per-Device Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/synccam-v5-per-device.yml'

permissions:
  contents: write

jobs:
  apply-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply per-device photo sync changes
        run: python tools/apply_v5_per_device_sync.py
      - name: Remove one-off migration files
        run: |
          rm -f tools/apply_v5_per_device_sync.py
          rm -f .github/workflows/synccam-v5-per-device.yml
      - name: Build SyncCam v5 APK
        working-directory: synccam
        run: gradle assembleDebug --stacktrace
      - name: Commit v5 to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SyncCam v5 per-device photo sync"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
      - name: Publish SyncCam v5.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cp synccam/app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v5.0.0.apk
          if gh release view v5.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v5.0.0 /tmp/SyncCam-v5.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v5.0.0 /tmp/SyncCam-v5.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "SyncCam v5.0.0" \
              --notes "Per-device host photo sync. The host lists each connected client with an individual SYNC control, plus SYNC ALL. Client uploads are incremental within the app session so already transferred JPEGs are not resent. Photos are stored in Pictures/SyncCam on the host."
          fi

