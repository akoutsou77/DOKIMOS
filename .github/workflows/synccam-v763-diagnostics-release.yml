name: Publish SyncCam v7.6.3 storage diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ff610e59f4e67dcc95d46823500f136d3e0de1e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exact diagnostics source
        working-directory: synccam
        run: |
          grep -q "versionCode 16" app/build.gradle
          grep -q "7.6.3-storage-diagnostics-test" app/build.gradle
          grep -q "STORAGE TESTS  •  T01-T11" app/src/main/java/com/openai/synccam/MainActivity.java
          grep -q '"T01"' app/src/main/java/com/openai/synccam/StorageDiagnostics.java
          grep -q '"T11"' app/src/main/java/com/openai/synccam/StorageDiagnostics.java
      - name: Build diagnostics APK
        working-directory: synccam
        run: gradle assembleDebug --stacktrace
      - name: Publish diagnostics prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp synccam/app/build/outputs/apk/debug/app-debug.apk /tmp/SyncCam-v7.6.3-STORAGE-DIAGNOSTICS.apk
          if gh release view v7.6.3-storage-diagnostics --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v7.6.3-storage-diagnostics /tmp/SyncCam-v7.6.3-STORAGE-DIAGNOSTICS.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v7.6.3-storage-diagnostics /tmp/SyncCam-v7.6.3-STORAGE-DIAGNOSTICS.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target 9ff610e59f4e67dcc95d46823500f136d3e0de1e \
              --title "SyncCam v7.6.3 STORAGE DIAGNOSTICS" \
              --prerelease \
              --notes "Diagnostic build for Android 11 storage failures. Captures one real JPEG and runs T01-T11 storage tests. Use COPY REPORT and return the complete result. This diagnostic prerelease does not replace stable v7.6.2."
          fi
